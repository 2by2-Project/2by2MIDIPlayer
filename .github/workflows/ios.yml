name: Build iOS

# Runs for the iOS work branches directly; master, pull requests and release tags run it through
# release.yml (workflow_call), which also attaches the IPA to GitHub Releases.
on:
  push:
    branches: [ios, 'ios/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read appVersion
        id: version
        shell: python
        run: |
          import os, pathlib, re
          values = re.findall(r'^\s*appVersion\s*=\s*(.*?)\s*$', pathlib.Path('gradle.properties').read_text(), re.M)
          if len(values) != 1 or not re.fullmatch(r'\d+\.\d+(\.\d+)?', values[0]):
              raise SystemExit('Invalid appVersion')
          version = values[0]
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must be v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Download BASS and BASSMIDI (iOS)
        shell: python
        run: |
          import hashlib, pathlib, shutil, tempfile, urllib.request, zipfile
          target = pathlib.Path('proprietary/ios')
          licenses = pathlib.Path('iosApp/xcode/Licenses')
          target.mkdir(parents=True, exist_ok=True)
          licenses.mkdir(parents=True, exist_ok=True)
          for name in ('bass', 'bassmidi'):
              with tempfile.TemporaryDirectory() as tmp:
                  archive = pathlib.Path(tmp) / 'download.zip'
                  urllib.request.urlretrieve(f'https://www.un4seen.com/files/{name}24-ios.zip', archive)
                  print(name, hashlib.sha256(archive.read_bytes()).hexdigest())
                  unpacked = pathlib.Path(tmp) / 'unpacked'
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(unpacked)
                  framework = unpacked / f'{name}.xcframework'
                  for slice in ('ios-arm64_armv7_armv7s', 'ios-arm64_i386_x86_64-simulator'):
                      binary = framework / slice / f'{name}.framework' / name
                      if not binary.is_file():
                          raise RuntimeError(f'Missing {binary.relative_to(unpacked)} in the official archive')
                  shutil.rmtree(target / f'{name}.xcframework', ignore_errors=True)
                  shutil.copytree(framework, target / f'{name}.xcframework', symlinks=True)
                  for extra in (f'{name}.h', f'{name}.txt'):
                      shutil.copy2(unpacked / extra, target / extra)
                  shutil.copy2(unpacked / f'{name}.txt', licenses / f'{name}.txt')
          for name in ('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'):
              shutil.copy2(name, licenses / name)

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          # Linking the release Kotlin/Native framework (Compose) needs more heap than the project default.
          # User-level properties override gradle.properties, also for Gradle runs started by Xcode.
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          echo 'org.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8' >> "$gradle_home/gradle.properties"
          xcodebuild -version
          brew install xcodegen

      - name: Shared tests on the iOS simulator
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :shared:iosSimulatorArm64Test 2>&1 | tee "$LOG_DIR/shared-tests.log"

      - name: Generate Xcode project
        working-directory: iosApp/xcode
        run: xcodegen generate

      - name: Build app (unsigned)
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          # Gradle builds the Kotlin framework (PlayerKit) inside Xcode's pre-build script.
          xcodebuild -project iosApp/xcode/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$LOG_DIR/xcodebuild.log" 2>&1
          status=$?
          grep -E '^e: |error:|BUILD (SUCCEEDED|FAILED)|\*\* ' "$LOG_DIR/xcodebuild.log" | tail -200
          tail -30 "$LOG_DIR/xcodebuild.log"
          exit $status

      - name: Package IPA
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=build/ios/Build/Products/Release-iphoneos/2by2MIDIPlayer.app
          test -x "$app/2by2MIDIPlayer"
          for name in bass bassmidi; do test -f "$app/Frameworks/$name.framework/$name"; done
          test -d "$app/demo"
          test -f "$app/Licenses/THIRD_PARTY_NOTICES.md"
          # Compose resources (the app logo) are copied by embedAndSignAppleFrameworkForXcode.
          find "$app/compose-resources" -type f | head -5 | grep -q . || { echo '::error::compose-resources missing from the app bundle'; exit 1; }
          # The executable must be an arm64 device binary.
          lipo -archs "$app/2by2MIDIPlayer" | grep -qw arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qry "2by2MIDIPlayer-$APP_VERSION-ios-unsigned.ipa" Payload)
          rm -rf dist/Payload
          ls -l dist
          echo 'The IPA is unsigned. Sign it when installing (AltStore, Sideloadly, or your own certificate).' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ steps.version.outputs.version }}
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Job logs need a token to download; annotations are public, so failures are summarized there.
      - name: Report failure details
        if: failure()
        shell: python
        run: |
          import os, pathlib, re
          logs = pathlib.Path(os.environ['LOG_DIR'])
          found = []
          for log in sorted(logs.glob('*.log')) if logs.is_dir() else []:
              lines = log.read_text(errors='replace').splitlines()
              errors = [l for l in lines if re.match(r'^(e: |error: )', l) or ' error: ' in l or 'What went wrong' in l
                        or re.search(r'Undefined symbol|ld: |clang: error|FAILED|Exception', l)]
              tail = lines[-40:]
              found.append((log.name, errors[:60], tail))
          def emit(title, text):
              text = text[:3800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          for name, errors, tail in found:
              if errors:
                  for i in range(0, len(errors), 20):
                      emit(f'{name} errors {i // 20 + 1}', '\n'.join(errors[i:i + 20]))
              emit(f'{name} tail', '\n'.join(tail))

  # Launch check: builds for the simulator, starts the app (English and Japanese), and keeps
  # screenshots. It verifies startup (Compose, resources, BASS init); sound is checked on devices.
  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
      BUNDLE_ID: jp.project2by2.musicplayer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Download BASS and BASSMIDI (iOS)
        shell: python
        run: |
          import pathlib, shutil, tempfile, urllib.request, zipfile
          target = pathlib.Path('proprietary/ios')
          target.mkdir(parents=True, exist_ok=True)
          for name in ('bass', 'bassmidi'):
              with tempfile.TemporaryDirectory() as tmp:
                  archive = pathlib.Path(tmp) / 'download.zip'
                  urllib.request.urlretrieve(f'https://www.un4seen.com/files/{name}24-ios.zip', archive)
                  unpacked = pathlib.Path(tmp) / 'unpacked'
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(unpacked)
                  shutil.rmtree(target / f'{name}.xcframework', ignore_errors=True)
                  shutil.copytree(unpacked / f'{name}.xcframework', target / f'{name}.xcframework', symlinks=True)
                  shutil.copy2(unpacked / f'{name}.h', target / f'{name}.h')

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          echo 'org.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8' >> "$gradle_home/gradle.properties"
          brew install xcodegen
          (cd iosApp/xcode && xcodegen generate)

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in items if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices | grep "$udid"

      - name: Build app for the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          xcodebuild -project iosApp/xcode/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO \
            build > "$LOG_DIR/xcodebuild-simulator.log" 2>&1
          status=$?
          grep -E '^e: |error:|BUILD (SUCCEEDED|FAILED)|\*\* ' "$LOG_DIR/xcodebuild-simulator.log" | tail -100
          exit $status

      - name: Launch and take screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p shots
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/2by2MIDIPlayer.app
          # A few files in Documents, as if copied there with the Files app.
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$data/Documents/Game Music"
          ls app/src/main/assets/demo | head -6 | while read -r f; do cp "app/src/main/assets/demo/$f" "$data/Documents/Game Music/"; done
          cp "$(ls app/src/main/assets/demo/* | head -1)" "$data/Documents/"
          check_running() {
            sleep "$1"
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID"; then
              echo "::error::The app is not running $1 s after launch ($2)"
              find ~/Library/Logs/DiagnosticReports -name '*2by2MIDIPlayer*' -newer shots -exec cat {} \; | head -150
              exit 1
            fi
          }
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -AppleLanguages '(en)' > "$LOG_DIR/app-en.log" 2>&1 &
          check_running 20 en
          xcrun simctl io "$UDID" screenshot shots/1-launch-en.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -AppleLanguages '(ja)' > "$LOG_DIR/app-ja.log" 2>&1 &
          check_running 20 ja
          xcrun simctl io "$UDID" screenshot shots/2-launch-ja.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          ls -l shots

      - name: Play a MIDI file with a SoundFont
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          fonts="$data/Library/Application Support/SoundFonts"
          mkdir -p "$fonts"
          # One of the recommended banks (the app downloads the same file).
          curl -sSL --retry 3 -o "$fonts/GeneralUser-GS.sf2" https://github.com/mrbumpy409/GeneralUser-GS/raw/refs/heads/main/GeneralUser-GS.sf2
          ls -l "$fonts"
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" sound_font_file -string GeneralUser-GS.sf2
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" sound_font_name -string 'General User GS'
          song=$(ls "$data/Documents/Game Music" | head -1)
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -AppleLanguages '(ja)' -smokePlay "doc:/Game Music/$song" > "$LOG_DIR/app-play.log" 2>&1 &
          sleep 12
          xcrun simctl io "$UDID" screenshot shots/3-now-playing.png
          sleep 5
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          grep 'smoke:' "$LOG_DIR/app-play.log" || true
          # The position must advance while playing (BASS output, renderer, SoundFont).
          python3 - "$LOG_DIR/app-play.log" <<'PYTHON'
          import re, sys
          lines = [l for l in open(sys.argv[1], errors='replace') if l.startswith('smoke:')]
          positions = [int(m.group(1)) for l in lines for m in [re.search(r'playing=true position=(\d+)', l)] if m]
          print('positions while playing:', positions)
          if len(positions) < 3 or positions[-1] - positions[0] < 2000:
              print('::warning::Playback did not advance in the simulator: ' + (lines[-1].strip() if lines else 'no smoke output'))
          PYTHON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-simulator-screenshots
          path: |
            shots/*.png
            ci-logs/app-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure details
        if: failure()
        shell: python
        run: |
          import os, pathlib, re
          logs = pathlib.Path(os.environ['LOG_DIR'])
          for log in sorted(logs.glob('*.log')) if logs.is_dir() else []:
              lines = log.read_text(errors='replace').splitlines()
              errors = [l for l in lines if re.match(r'^(e: |error: )', l) or ' error: ' in l
                        or re.search(r'Undefined symbol|ld: |FAILED|Exception|Terminating|fatal', l)]
              for i in range(0, min(len(errors), 60), 20):
                  text = '\n'.join(errors[i:i + 20])[:3800].replace('%', '%25').replace('\n', '%0A')
                  print(f'::error title={log.name} errors {i // 20 + 1}::{text}')
              text = '\n'.join(lines[-40:])[:3800].replace('%', '%25').replace('\n', '%0A')
              print(f'::error title={log.name} tail::{text}')
