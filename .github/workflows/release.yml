name: Build Windows / Linux / Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read appVersion
        id: version
        run: |
          $lines = @(Get-Content gradle.properties | Where-Object { $_ -match '^\s*appVersion\s*=' })
          if ($lines.Count -ne 1) { throw 'Expected exactly one appVersion in gradle.properties' }
          $version = ($lines[0] -split '=', 2)[1].Trim()
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Invalid appVersion: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must be v$version to match gradle.properties"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - uses: gradle/actions/setup-gradle@v4

      - name: Download BASS and BASSMIDI (Windows x64)
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeDir = New-Item -ItemType Directory -Force proprietary/win-x64
          $licenseDir = New-Item -ItemType Directory -Force desktopApp/resources/common/licenses/un4seen
          foreach ($name in @('bass', 'bassmidi')) {
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            $unpacked = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "https://www.un4seen.com/files/${name}24.zip" -OutFile $zip -MaximumRetryCount 3
            Expand-Archive -LiteralPath $zip -DestinationPath $unpacked -Force
            $dll = Join-Path $unpacked "x64/$name.dll"
            if (!(Test-Path $dll)) { throw "Missing x64/$name.dll in official archive" }
            # Reject accidental 32-bit libraries before packaging.
            $bytes = [IO.File]::ReadAllBytes($dll)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
              throw "$name.dll is not an x64 binary"
            }
            Copy-Item $dll $nativeDir
            Copy-Item (Join-Path $unpacked "$name.txt") $licenseDir
            Get-FileHash $zip -Algorithm SHA256
          }

      - name: Build application with bundled Java runtime
        run: |
          ./gradlew.bat --no-daemon --stacktrace :desktopApp:createDistributable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify MSI installer
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = 'desktopApp/build/compose/binaries/main/app/2by2MusicPlayer'
          if (!(Test-Path "$appDir/2by2MusicPlayer.exe")) { throw 'Application launcher was not generated' }
          if (!(Test-Path "$appDir/runtime")) { throw 'Bundled Java runtime is missing' }
          foreach ($name in @('bass.dll', 'bassmidi.dll')) {
            if (!(Get-ChildItem $appDir -Recurse -File -Filter $name)) { throw "Packaged $name is missing" }
          }
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $appDir
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = ([version]$env:APP_VERSION).ToString()
          if ($version.Split('.').Count -eq 2) { $version += '.0' }
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw 'MSI version must be within 255.255.65535'
          }
          # WiX 3 is supplied by windows-2022. jpackage 17 requires candle/light on PATH.
          $env:PATH = "$env:WIX/bin;$env:PATH"
          Get-Command candle.exe, light.exe -ErrorAction Stop | Out-Null
          # Customize the template from the exact JDK used to build this installer.
          $resources = Join-Path $env:RUNNER_TEMP 'msi-resources'
          & "$env:JAVA_HOME/bin/jmod.exe" extract --dir $resources "$env:JAVA_HOME/jmods/jdk.jpackage.jmod"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $template = Join-Path $resources 'classes/jdk/jpackage/internal/resources/main.wxs'
          $wxs = [IO.File]::ReadAllText($template)
          $old = 'IncludeMaximum="$(var.JpUpgradeVersionOnlyDetectUpgrade)"'
          if (!$wxs.Contains($old)) { throw 'jpackage upgrade template changed; review required' }
          $wxs = $wxs.Replace($old, 'IncludeMaximum="yes"')
          $old = 'IncludeMinimum="$(var.JpUpgradeVersionOnlyDetectDowngrade)"'
          if (!$wxs.Contains($old)) { throw 'jpackage downgrade template changed; review required' }
          $wxs = $wxs.Replace($old, 'IncludeMinimum="no"')
          # A fresh ProductCode lets a same-version rebuild perform a major upgrade.
          # jpackage otherwise derives it from the version, which can cause MSI 1638.
          $old = 'Id="$(var.JpProductCode)"'
          if (!$wxs.Contains($old)) { throw 'jpackage product template changed; review required' }
          $wxs = $wxs.Replace($old, 'Id="*"')
          # As in 7914e89, explicitly link a full WiX wizard rather than JpUI.
          # Use the directory-only wizard; file associations are not registered.
          $old = '<UIRef Id="JpUI"/>'
          if (!$wxs.Contains($old)) { throw 'jpackage UI template changed; review required' }
          $wizard = [IO.File]::ReadAllText("$PWD/desktopApp/installer/windows/simple-wizard.xml")
          $wxs = $wxs.Replace($old, $wizard)
          $wxs = $wxs.Replace('<ComponentGroupRef Id="FileAssociations"/>', '')
          [IO.File]::WriteAllText((Join-Path $resources 'main.wxs'), $wxs)
          $description = "2by2 MIDI Player - Your Music Workstation Companion`n`nListen to MIDI music as background audio while you work or play. From classic MIDI tracks to game music, 2by2 MIDI Player delivers versatile playback for music creators and enthusiasts."
          # Never change this UUID between releases (including same-version rebuilds).
          & "$env:JAVA_HOME/bin/jpackage.exe" --type msi --app-image $appDir --dest dist `
            --name 2by2MusicPlayer --app-version $version --vendor 'Project 2by2' `
            --description $description --win-upgrade-uuid '6ef55885-394e-4bb7-b098-44be9ad975d3' `
            --win-menu --win-shortcut --win-dir-chooser --resource-dir $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem dist -Filter '*.msi')
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSI' }
          # msiexec requires a native Windows path, not a mixed slash path.
          $distDir = (Get-Item -LiteralPath dist).FullName
          $msi = Join-Path $distDir "2by2MIDIPlayer-$env:APP_VERSION-windows-x64.msi"
          Move-Item -LiteralPath $packages[0].FullName -Destination $msi
          $msi = (Get-Item -LiteralPath $msi).FullName
          ./desktopApp/installer/windows/verify-msi.ps1 -Path $msi
          foreach ($attempt in 1..3) {
            # Install twice, then verify the maintenance wizard's repair operation.
            $operation = if ($attempt -eq 3) { '/fa' } else { '/i' }
            if ($attempt -eq 3) {
              # Exercise the same MSI's standard repair operation.
              Remove-Item "$env:ProgramFiles/2by2MusicPlayer/NOTICE"
            }
            $log = Join-Path $env:RUNNER_TEMP "msi-install-$attempt.log"
            $process = Start-Process msiexec.exe -ArgumentList "$operation `"$msi`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              Get-Content $log -Tail 100
              throw "MSI install attempt $attempt failed: $($process.ExitCode)"
            }
            if (!(Test-Path "$env:ProgramFiles/2by2MusicPlayer/2by2MusicPlayer.exe")) {
              throw 'Installed launcher is missing'
            }
            if (!(Test-Path "$env:ProgramFiles/2by2MusicPlayer/NOTICE")) { throw 'MSI did not restore NOTICE' }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2by2MIDIPlayer-${{ steps.version.outputs.version }}
          path: dist/2by2MIDIPlayer-${{ steps.version.outputs.version }}-windows-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libasound2-dev desktop-file-utils

      - name: Read appVersion
        id: version
        shell: python
        run: |
          import os, pathlib, re
          values = re.findall(r'^\s*appVersion\s*=\s*(.*?)\s*$', pathlib.Path('gradle.properties').read_text(), re.M)
          if len(values) != 1 or not re.fullmatch(r'\d+\.\d+(\.\d+)?', values[0]):
              raise SystemExit('Invalid appVersion')
          version = values[0]
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must be v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

      - name: Download BASS and BASSMIDI (Linux x64)
        shell: python
        run: |
          import hashlib, pathlib, tempfile, urllib.request, zipfile
          native = pathlib.Path('proprietary/linux-x64')
          notices = pathlib.Path('desktopApp/resources/common/licenses/un4seen')
          native.mkdir(parents=True, exist_ok=True)
          notices.mkdir(parents=True, exist_ok=True)
          for name in ('bass', 'bassmidi'):
              with tempfile.TemporaryDirectory() as tmp:
                  archive = pathlib.Path(tmp) / 'download.zip'
                  urllib.request.urlretrieve(f'https://www.un4seen.com/files/{name}24-linux.zip', archive)
                  print(name, hashlib.sha256(archive.read_bytes()).hexdigest())
                  with zipfile.ZipFile(archive) as z:
                      members = [p for p in z.namelist() if p == f'libs/x86_64/lib{name}.so']
                      if len(members) != 1:
                          raise RuntimeError(f'Expected one libs/x86_64/lib{name}.so')
                      data = z.read(members[0])
                      if data[:6] != b'\x7fELF\x02\x01' or int.from_bytes(data[18:20], 'little') != 62:
                          raise RuntimeError(f'lib{name}.so is not an x64 ELF binary')
                      (native / f'lib{name}.so').write_bytes(data)
                      (notices / f'{name}.txt').write_bytes(z.read(f'{name}.txt'))

      - name: Build DEB and RPM with bundled Java runtime
        run: |
          bash ./gradlew --no-daemon --stacktrace :desktopApp:packageInstallers

      - name: Verify and prepare Linux artifacts
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          appDir=desktopApp/build/compose/binaries/main/app/project2by2-midiplayer
          test -x "$appDir/bin/project2by2-midiplayer"
          test -d "$appDir/lib/runtime"
          for name in libbass.so libbassmidi.so; do
            test -n "$(find "$appDir" -type f -name "$name" -print -quit)"
          done
          test -f "$appDir/lib/app/resources/licenses/project/THIRD_PARTY_NOTICES.md"
          shopt -s nullglob
          debs=(desktopApp/build/distributions/*.deb)
          rpms=(desktopApp/build/distributions/*.rpm)
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = project2by2-midiplayer
          test "$(dpkg-deb -f "${debs[0]}" Maintainer)" = '2by2 Project <support@project2by2.jp>'
          test "$(rpm -qp --queryformat '%{NAME}' "${rpms[0]}")" = project2by2-midiplayer
          python3 - "${debs[0]}" "${rpms[0]}" <<'PYTHON'
          import pathlib, subprocess, sys
          expected = pathlib.Path('desktopApp/installer/linux/description-ja.txt').read_text(encoding='utf-8').rstrip('\n')
          deb = subprocess.check_output(['dpkg-deb', '-f', sys.argv[1], 'Description']).decode('utf-8').rstrip('\n')
          lines = deb.splitlines()
          decoded = '\n'.join(line if i == 0 else ('' if line == ' .' else line[1:]) for i, line in enumerate(lines))
          assert decoded == expected, repr(decoded)
          rpm = subprocess.check_output(['rpm', '-qp', '--queryformat', '%{DESCRIPTION}', sys.argv[2]]).decode('utf-8')
          assert rpm.rstrip('\n') == expected, repr(rpm)
          summary = subprocess.check_output(['rpm', '-qp', '--queryformat', '%{SUMMARY}', sys.argv[2]]).decode('utf-8')
          assert summary == expected.splitlines()[0], repr(summary)
          PYTHON
          extracted="$RUNNER_TEMP/project2by2-midiplayer-deb"
          dpkg-deb -x "${debs[0]}" "$extracted"
          desktopFile=$(find "$extracted" -name 'project2by2-midiplayer-project2by2-midiplayer.desktop' -print -quit)
          test -n "$desktopFile"
          desktop-file-validate "$desktopFile"
          grep -Fxq 'Name=2by2 MIDI Player' "$desktopFile"
          iconPath=$(sed -n 's/^Icon=//p' "$desktopFile")
          iconHash=$(sha256sum desktopApp/src/main/resources/app-icon.png | cut -c1-16)
          test "$iconPath" = "/opt/project2by2-midiplayer/lib/app/resources/branding/2by2-midi-player-$iconHash.png"
          cmp desktopApp/src/main/resources/app-icon.png "$extracted$iconPath"
          grep -Fxq 'MimeType=audio/midi;audio/x-midi;audio/mid;audio/x-mid;' "$desktopFile"
          grep -Fxq 'Exec=/opt/project2by2-midiplayer/bin/project2by2-midiplayer %F' "$desktopFile"
          if grep -Eq '^Actions=' "$desktopFile"; then
            echo 'Unexpected desktop action in desktop entry' >&2
            exit 1
          fi
          test ! -e "$extracted/opt/project2by2-midiplayer/lib/app/resources/integration/set-default-midi.sh"
          mkdir -p dist
          cp "${debs[0]}" "dist/2by2MIDIPlayer-$APP_VERSION-linux-x64.deb"
          cp "${rpms[0]}" "dist/2by2MIDIPlayer-$APP_VERSION-linux-x64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ steps.version.outputs.version }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Read appVersion
        id: version
        shell: python
        run: |
          import os, pathlib, re
          values = re.findall(r'^\s*appVersion\s*=\s*(.*?)\s*$', pathlib.Path('gradle.properties').read_text(), re.M)
          if len(values) != 1 or not re.fullmatch(r'\d+\.\d+(\.\d+)?', values[0]):
              raise SystemExit('Invalid appVersion')
          version = values[0]
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must be v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

      - name: Download Android BASS libraries and Java bindings
        shell: python
        run: |
          import hashlib, pathlib, shutil, tempfile, urllib.request, zipfile
          java_dir = pathlib.Path('app/src/main/java/com/un4seen/bass')
          java_dir.mkdir(parents=True, exist_ok=True)
          notices = pathlib.Path('app/src/main/assets/licenses/un4seen')
          notices.mkdir(parents=True, exist_ok=True)
          for name in ('bass', 'bassmidi'):
              with tempfile.TemporaryDirectory() as tmp:
                  archive = pathlib.Path(tmp) / 'download.zip'
                  urllib.request.urlretrieve(f'https://www.un4seen.com/files/{name}24-android.zip', archive)
                  print(name, hashlib.sha256(archive.read_bytes()).hexdigest())
                  with zipfile.ZipFile(archive) as z:
                      # Copy only the official bindings, native libraries and notices.
                      def copy_member(member, target):
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with z.open(member) as src, target.open('wb') as dst:
                              shutil.copyfileobj(src, dst)
                      java = [p for p in z.namelist() if pathlib.PurePosixPath(p).name == f'{name.upper()}.java']
                      if len(java) != 1:
                          raise RuntimeError(f'Expected one {name.upper()}.java')
                      copy_member(java[0], java_dir / f'{name.upper()}.java')
                      for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'):
                          dlls = [p for p in z.namelist() if p.endswith(f'/{abi}/lib{name}.so')]
                          if len(dlls) != 1:
                              raise RuntimeError(f'Missing or ambiguous {name} library for {abi}')
                          copy_member(dlls[0], pathlib.Path('app/src/main/jniLibs') / abi / f'lib{name}.so')
                      copy_member(f'{name}.txt', notices / f'{name}.txt')
          for name in ('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'):
              shutil.copy2(name, notices.parent / name)

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Prepare APK artifacts and optionally sign release
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp app/build/outputs/apk/debug/app-debug.apk "dist/android/2by2MIDIPlayer-$APP_VERSION-debug.apk"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            cp "$unsigned" "dist/android/2by2MIDIPlayer-$APP_VERSION-unsigned.apk"
            echo 'Release signing is not configured; unsigned APK saved as an artifact only.' >> "$GITHUB_STEP_SUMMARY"
          else
            : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
            : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
            : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
            keystore="$RUNNER_TEMP/android-release.jks"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            buildtools="$ANDROID_HOME/build-tools/36.0.0"
            "$buildtools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            signed="dist/android/2by2MIDIPlayer-$APP_VERSION.apk"
            "$buildtools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$signed" "$RUNNER_TEMP/aligned.apk"
            "$buildtools/apksigner" verify --verbose "$signed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ steps.version.outputs.version }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 2by2MIDIPlayer-${{ needs.windows.outputs.version }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: Linux-${{ needs.windows.outputs.version }}
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: Android-${{ needs.windows.outputs.version }}
          path: dist/android

      - name: Attach desktop installers and signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/2by2MIDIPlayer-$APP_VERSION-windows-x64.msi"
          test -f "dist/linux/2by2MIDIPlayer-$APP_VERSION-linux-x64.deb"
          test -f "dist/linux/2by2MIDIPlayer-$APP_VERSION-linux-x64.rpm"
          cat > "$RUNNER_TEMP/install-notes.md" <<'NOTES'
          ## Desktop installation

          Windows: Open the MSI to install or update. Reopening the same MSI supports reinstall/repair.

          Debian/Ubuntu (install, update, or reinstall):
          `sudo apt install --reinstall ./2by2MIDIPlayer-VERSION-linux-x64.deb`

          Fedora/RPM: Use your software manager or `sudo dnf install ./2by2MIDIPlayer-VERSION-linux-x64.rpm`.
          To reinstall the same version, use `sudo dnf reinstall ./2by2MIDIPlayer-VERSION-linux-x64.rpm`.
          With dependencies already installed, `sudo rpm -Uvh --replacepkgs ./2by2MIDIPlayer-VERSION-linux-x64.rpm`
          handles initial installation, upgrades, and identical-package reinstalls.
          Linux graphical reinstall behavior depends on the distribution's software manager.
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "2by2MIDIPlayer-$APP_VERSION" \
              --notes-file "$RUNNER_TEMP/install-notes.md" --generate-notes
          fi
          gh release upload "$TAG" "dist/2by2MIDIPlayer-$APP_VERSION-windows-x64.msi" --clobber
          gh release upload "$TAG" "dist/linux/2by2MIDIPlayer-$APP_VERSION-linux-x64.deb" \
            "dist/linux/2by2MIDIPlayer-$APP_VERSION-linux-x64.rpm" --clobber
          if [[ -f "dist/android/2by2MIDIPlayer-$APP_VERSION.apk" ]]; then
            gh release upload "$TAG" "dist/android/2by2MIDIPlayer-$APP_VERSION.apk" --clobber
          fi
