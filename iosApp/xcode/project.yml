# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate the project on macOS with:
#   cd iosApp/xcode && xcodegen generate
# The Kotlin framework (PlayerKit) is built by Gradle in the pre-build script, and the BASS/BASSMIDI
# XCFrameworks come from proprietary/ios (not in Git; see proprietary/README.md).
name: iosApp
options:
  bundleIdPrefix: jp.project2by2
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: App
      # The Android app's sample MIDI files, shown as the sample folder.
      - path: ../../app/src/main/assets/demo
        type: folder
        buildPhase: resources
      - path: Licenses
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: 2by2MIDIPlayer
        PRODUCT_BUNDLE_IDENTIFIER: jp.project2by2.musicplayer
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        # Gradle writes the framework outside the sandboxed script locations.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "PlayerKit"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - framework: ../../proprietary/ios/bass.xcframework
        embed: true
        codeSign: true
      - framework: ../../proprietary/ios/bassmidi.xcframework
        embed: true
        codeSign: true
      - sdk: AVFAudio.framework
      - sdk: MediaPlayer.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :iosApp:embedAndSignAppleFrameworkForXcode
